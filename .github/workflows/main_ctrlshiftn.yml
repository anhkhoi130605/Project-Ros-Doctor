# Workflow xây dựng & đóng gói triển khai toàn bộ hệ thống CtrlShiftN (ASP.NET Core, ReactJS, Python AI Agent)
name: Build & Package Full Stack Deployment (CtrlShiftN)

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. BUILD & PUBLISH BACKEND ASP.NET CORE (.NET 10)
  # =========================================================================
  build-backend-dotnet:
    name: Build & Publish ASP.NET Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET Core 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: dotnet restore Backend.slnx

      - name: Build Backend (Release)
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: dotnet build Backend.slnx --no-restore --configuration Release

      - name: Publish WebAPI
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: dotnet publish API/API.csproj -c Release -o ${{ runner.temp }}/backend-dotnet-publish

      - name: Upload .NET WebAPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dotnet-package
          path: ${{ runner.temp }}/backend-dotnet-publish

  # =========================================================================
  # 2. BUILD PRODUCTION FRONTEND (REACTJS / VITE)
  # =========================================================================
  build-frontend-react:
    name: Build Frontend (ReactJS / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'WebAPI/FrontEnd(ReactJS)/package-lock.json'

      - name: Install dependencies
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: npm ci || npm install --prefer-offline

      - name: Build Vite Production Bundle
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-package
          path: WebAPI/FrontEnd(ReactJS)/dist

  # =========================================================================
  # 3. VERIFY & PACKAGE PYTHON AI AGENT (FASTAPI / LANGGRAPH)
  # =========================================================================
  build-python-ai:
    name: Package Python AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python AI Application Startup
        env:
          APP_ENV: production
          OPENAI_API_KEY: mock-verify-key
        run: |
          python -c "import src.main; print('Python AI application loaded successfully')"

      - name: Stage Python AI Files
        run: |
          mkdir -p ${{ runner.temp }}/python-ai-publish
          cp -r src requirements.txt data ${{ runner.temp }}/python-ai-publish/ 2>/dev/null || cp -r src requirements.txt ${{ runner.temp }}/python-ai-publish/

      - name: Upload Python AI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-ai-package
          path: ${{ runner.temp }}/python-ai-publish

  # =========================================================================
  # 4. DEPLOY TO AZURE / CLOUD SERVICE
  # =========================================================================
  deploy-azure:
    name: Deploy Backend to Azure Web App
    runs-on: ubuntu-latest
    needs: [build-backend-dotnet, build-frontend-react, build-python-ai]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download .NET WebAPI artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dotnet-package
          path: ./publish

      - name: Download Frontend ReactJS artifact into wwwroot
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-package
          path: ./publish/wwwroot

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CtrlShiftN'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4CAF0059E81E48D690CA5E536CA48760 }}