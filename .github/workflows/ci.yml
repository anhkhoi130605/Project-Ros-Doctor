name: CI - Build, Test & Merge Protection

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  build-and-test:
    name: Build & Test All Services (Local Runner)
    runs-on: [self-hosted, team-137]
    env:
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: powershell

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v5

      # =======================================================
      # PHẦN 1: AI SERVICE (PYTHON) - TỐI ƯU TỐC ĐỘ DÙNG PYTHON MÁY
      # =======================================================
      - name: 1.1 [AI / Python] Cài đặt dependencies (Dùng Cache cục bộ)
        run: |
          pip install --prefer-binary -r requirements.txt

      - name: 1.2 [AI / Python] Kiểm tra lint (Ruff)
        run: |
          ruff check src/ tests/

      - name: 1.3 [AI / Python] Chạy Unit Test (Pytest)
        env:
          APP_ENV: test
          OPENAI_API_KEY: mock-test-key-ci
        run: |
          pytest tests/ -v --tb=short --basetemp=.pytest_temp

      - name: 1.4 [AI / Python] Chạy CI/CD Benchmark Pipeline (Tier C Quality Gate)
        env:
          APP_ENV: test
          OPENAI_API_KEY: mock-test-key-ci
        run: |
          python eval/benchmark_runner.py --ci --threshold 0.80 --max-latency 3.0

      # =======================================================
      # PHẦN 2: BACKEND (.NET 10) - TỐI ƯU TỐC ĐỘ DÙNG SDK MÁY
      # =======================================================
      - name: 2.1 [Backend] Build Backend (Release mode)
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: |
          dotnet build Backend.slnx --configuration Release --verbosity minimal -p:UseSharedCompilation=false -p:NodeReuse=false

      - name: 2.2 [Backend] Chạy Backend Tests
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: |
          dotnet test Backend.slnx --no-build --configuration Release --verbosity minimal -p:UseSharedCompilation=false -p:NodeReuse=false

      - name: 2.3 [Backend] Tắt .NET Build Server (Ngăn VBCSCompiler treo runner)
        if: always()
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: |
          dotnet build-server shutdown

      # =======================================================
      # PHẦN 3: FRONTEND (REACTJS / VITE) - TỐI ƯU BUILD
      # =======================================================
      - name: 3.1 [Frontend] Cài đặt dependencies (Ưu tiên Offline Cache)
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: |
          npm install --prefer-offline --no-audit --no-fund

      - name: 3.2 [Frontend] Build Production (Vite)
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: |
          npm run build

      - name: 3.3 [Frontend] Chạy Tests (nếu có)
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: |
          npm test --if-present

      # =======================================================
      # PHẦN 4: AUTO MERGE PULL REQUEST (KHI TẤT CẢ ĐỀU PASS)
      # =======================================================
      - name: 4.1 Auto merge PR khi toàn bộ test & build trên máy thành công
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              console.log(`Tất cả build và test trên máy thành công! Đang tiến hành merge PR #${prNumber}...`);
              await github.rest.pulls.merge({
                owner: owner,
                repo: repo,
                pull_number: prNumber,
                merge_method: 'merge'
              });
              console.log(`Đã auto-merge PR #${prNumber} thành công lên server.`);
            } catch (error) {
              console.log(`Thông báo về trạng thái merge: ${error.message}`);
              console.log('Lưu ý: Nếu PR yêu cầu người duyệt (Reviewer Approval) hoặc Branch Protection bắt buộc review, bạn chỉ cần review/approve trên GitHub thì PR sẽ được merge.');
            }
