name: Build, Test & Auto Merge

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test All Services
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      # =======================================================
      # PHẦN 1: AI (PYTHON) - LINT & TEST
      # =======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: [Python] Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: [Python] Lint with ruff
        run: ruff check src/ tests/
        continue-on-error: true # Đặt true nếu bạn chưa muốn chặn build vì lỗi format code

      - name: [Python] Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      # =======================================================
      # PHẦN 2: BACKEND (.NET) - RESTORE, BUILD & TEST
      # =======================================================
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Đổi thành 6.0.x hoặc 7.0.x nếu bạn dùng bản khác

      - name: [Backend] Restore dependencies
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: dotnet restore

      - name: [Backend] Build Backend
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: dotnet build --no-restore --configuration Release

      - name: [Backend] Run Backend tests
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: dotnet test --no-build --configuration Release --verbosity normal

      # =======================================================
      # PHẦN 3: FRONTEND (REACTJS) - INSTALL, BUILD & TEST
      # =======================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: [Frontend] Install dependencies
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: npm install

      - name: [Frontend] Build Frontend
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: npm run build

      - name: [Frontend] Run Frontend tests (CI mode)
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: npm test -- --watchAll=false
        env:
          CI: true

      # =======================================================
      # PHẦN 4: TỰ ĐỘNG MERGE (KHI TẤT CẢ ĐÃ PASS)
      # =======================================================
      - name: Auto merge Pull Request
        if: github.event_name == 'pull_request'
        run: gh pr merge $env:PR_URL --auto --merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
