name: CI - Build, Test & Merge Protection

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Quyền hạn cần thiết để kiểm tra status và hỗ trợ auto-merge
permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  build-and-test:
    name: Build & Test All Services (Local Runner)
    runs-on: [self-hosted, team-137]
    defaults:
      run:
        shell: powershell

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      # =======================================================
      # PHẦN 1: AI SERVICE (PYTHON 3.11) - LINT & TEST
      # =======================================================
      - name: 1.1 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 1.2 [AI / Python] Cài đặt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1.3 [AI / Python] Kiểm tra chất lượng code (Ruff Lint)
        run: |
          ruff check src/ tests/

      - name: 1.4 [AI / Python] Chạy Unit Test (Pytest)
        env:
          APP_ENV: test
          OPENAI_API_KEY: mock-test-key-ci
        run: |
          pytest tests/ -v --tb=short

      # =======================================================
      # PHẦN 2: BACKEND (.NET 10) - RESTORE, BUILD & TEST
      # =======================================================
      - name: 2.1 Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 2.2 [Backend] Restore dependencies
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: |
          dotnet restore Backend.slnx

      - name: 2.3 [Backend] Build Backend (Release mode)
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: |
          dotnet build Backend.slnx --no-restore --configuration Release

      - name: 2.4 [Backend] Chạy Backend Tests
        working-directory: "WebAPI/BackEnd(ASP.Net)"
        run: |
          dotnet test Backend.slnx --no-build --configuration Release --verbosity normal

      # =======================================================
      # PHẦN 3: FRONTEND (REACTJS / VITE) - BUILD & TEST
      # =======================================================
      - name: 3.1 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "WebAPI/FrontEnd(ReactJS)/package-lock.json"

      - name: 3.2 [Frontend] Cài đặt dependencies
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: |
          npm install

      - name: 3.3 [Frontend] Build Production (Vite)
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: |
          npm run build

      - name: 3.4 [Frontend] Chạy Tests (nếu có)
        working-directory: "WebAPI/FrontEnd(ReactJS)"
        run: |
          npm test --if-present

      # =======================================================
      # PHẦN 4: HỖ TRỢ AUTO MERGE PULL REQUEST (KHI TẤT CẢ ĐỀU PASS)
      # =======================================================
      - name: 4.1 Auto merge PR khi toàn bộ test & build trên máy thành công
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              console.log(`Tất cả build và test trên máy thành công! Đang tiến hành merge PR #${prNumber}...`);
              await github.rest.pulls.merge({
                owner: owner,
                repo: repo,
                pull_number: prNumber,
                merge_method: 'merge'
              });
              console.log(`Đã auto-merge PR #${prNumber} thành công lên server.`);
            } catch (error) {
              console.log(`Thông báo về trạng thái merge: ${error.message}`);
              console.log('Lưu ý: Nếu PR yêu cầu người duyệt (Reviewer Approval) hoặc Branch Protection bắt buộc review, bạn chỉ cần review/approve trên GitHub thì PR sẽ được merge.');
            }
