version: "3.8"

services:
  # 1. Frontend: ReactJS SPA served by Nginx (Reverse Proxy to API & Python AI Agent)
  frontend:
    build:
      context: ./WebAPI/FrontEnd(ReactJS)
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend-aspnet:
        condition: service_healthy
      backend-python:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # 2. Backend ASP.NET Core: WebAPI Service
  backend-aspnet:
    build:
      context: ./WebAPI/BackEnd(ASP.Net)
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/dashboard/health || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  # 3. Python AI Backend: FastAPI + LangGraph + RAG Pipeline
  backend-python:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - BACKEND_API_URL=http://backend-aspnet:5000
    volumes:
      - chroma-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

volumes:
  chroma-data:
    driver: local

networks:
  app-network:
    driver: bridge
